
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOL Wise Camp Dashboard</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f1f5f9;
  color:#1e293b;
}
.header{
  background:#006633;
  color:white;
  padding:20px;
  text-align:center;
}
.header h2{margin:0}
.container{
  max-width:1200px;
  margin:20px auto;
  padding:15px;
}
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-bottom:20px;
}
.card{
  background:white;
  padding:20px;
  border-radius:10px;
  box-shadow:0 2px 8px #0001;
  text-align:center;
}
.card h3{
  margin:0 0 10px;
  color:#475569;
  font-size:15px;
}
.card .number{
  font-size:30px;
  font-weight:bold;
  color:#006633;
}
.search{
  width:100%;
  padding:12px;
  border:1px solid #cbd5e1;
  border-radius:6px;
  margin-bottom:15px;
  font-size:16px;
}
.table-container{
  overflow-x:auto;
  background:white;
  border-radius:8px;
}
table{
  width:100%;
  border-collapse:collapse;
  min-width:700px;
}
th{
  background:#006633;
  color:white;
  padding:12px;
  text-align:center;
}
td{
  padding:12px;
  border-bottom:1px solid #e2e8f0;
  text-align:center;
}
tr:hover{background:#f0fdf4}
a{
  color:#006633;
  font-weight:bold;
  text-decoration:none;
}
a:hover{text-decoration:underline}
.status{
  text-align:center;
  padding:20px;
  background:white;
  border-radius:8px;
  margin-bottom:15px;
}
.error{color:#b91c1c}
.footer{
  text-align:center;
  padding:20px;
  color:#64748b;
  font-size:13px;
}
</style>
</head>

<body>

<div class="header">
  <h2>DFS SATURATION CAMP</h2>
  <p>SOL-WISE CAMP REPORTING DASHBOARD</p>
</div>

<div class="container">

  <div id="status" class="status">
    Loading dashboard data...
  </div>

  <div class="cards">
    <div class="card">
      <h3>Total SOLs</h3>
      <div class="number" id="totalSOL">0</div>
    </div>

    <div class="card">
      <h3>Total Camps Allotted</h3>
      <div class="number" id="totalAllotted">0</div>
    </div>

    <div class="card">
      <h3>Camps Conducted</h3>
      <div class="number" id="totalConducted">0</div>
    </div>

    <div class="card">
      <h3>Camps Pending</h3>
      <div class="number" id="totalPending">0</div>
    </div>
  </div>

  <input
    type="text"
    id="search"
    class="search"
    placeholder="Search SOL ID or Branch Name..."
    onkeyup="filterTable()"
  >

  <div class="table-container">
    <table id="solTable">
      <thead>
        <tr>
          <th>S.No.</th>
          <th>SOL ID</th>
          <th>Branch Name</th>
          <th>Camps Allotted</th>
          <th>Camps Conducted</th>
          <th>Pending</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="tableBody">
      </tbody>
    </table>
  </div>

</div>

<div class="footer">
  Developed for RO Jabalpur | IT & FI Department
</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwHkmc9qul-GOuWTTTCKD3QKUdRLLcn9Xv7xKP-0kC46DHfJ6fO5rYnDWOEPoq09uz-/exec";

function setStatus(message,isError=false){
  const el=document.getElementById("status");
  el.textContent=message;
  el.className=isError?"status error":"status";
}

async function api(action,extra={}){
  const payload=Object.assign({action:action},extra);

  const response=await fetch(API_URL,{
    method:"POST",
    headers:{
      "Content-Type":"text/plain;charset=utf-8"
    },
    body:JSON.stringify(payload)
  });

  if(!response.ok){
    throw new Error("HTTP Error: "+response.status);
  }

  const result=await response.json();

  if(result.success===false){
    throw new Error(result.message||"API returned error");
  }

  return result.data!==undefined ? result.data : result;
}

function clean(value){
  return String(value??"").trim();
}

function getValue(obj,keys){
  for(const key of keys){
    if(obj[key]!==undefined && obj[key]!==null){
      return obj[key];
    }
  }
  return "";
}

function getSOL(obj){
  return clean(getValue(obj,[
    "solId","SOL ID","Sol ID","sol_id","SOL"
  ]));
}

function getBranch(obj){
  return clean(getValue(obj,[
    "branchName","BRANCH","Branch Name",
    "branch_name","branch"
  ]));
}

function getGPCode(obj){
  return clean(getValue(obj,[
    "gpCode","GP Code",
    "Gram Panchayat (GP) Code","gp_code"
  ]));
}

function buildDashboard(master,reports){

  const gpMaster=master.gpMaster||master.GP||master.masterData||[];

  if(!Array.isArray(gpMaster)||gpMaster.length===0){
    throw new Error(
      "GP Master data empty. Check getMasterData() in Apps Script."
    );
  }

  if(!Array.isArray(reports)){
    reports=reports.reports||reports.data||[];
  }

  if(!Array.isArray(reports)){
    reports=[];
  }

  const conductedCodes=new Set();

  reports.forEach(report=>{
    const code=getGPCode(report);
    if(code) conductedCodes.add(code);
  });

  const solMap={};

  gpMaster.forEach(gp=>{

    const sol=getSOL(gp);
    const branch=getBranch(gp);
    const gpCode=getGPCode(gp);

    if(!sol) return;

    if(!solMap[sol]){
      solMap[sol]={
        solId:sol,
        branchName:branch,
        allotted:0,
        conducted:0
      };
    }

    solMap[sol].allotted++;

    if(gpCode && conductedCodes.has(gpCode)){
      solMap[sol].conducted++;
    }
  });

  const rows=Object.values(solMap);

  rows.forEach(row=>{
    row.pending=Math.max(0,row.allotted-row.conducted);
  });

  rows.sort((a,b)=>
    Number(a.solId)-Number(b.solId)
  );

  document.getElementById("totalSOL").textContent=rows.length;

  document.getElementById("totalAllotted").textContent=
    rows.reduce((sum,row)=>sum+row.allotted,0);

  document.getElementById("totalConducted").textContent=
    rows.reduce((sum,row)=>sum+row.conducted,0);

  document.getElementById("totalPending").textContent=
    rows.reduce((sum,row)=>sum+row.pending,0);

  renderTable(rows);

  setStatus("Dashboard loaded successfully.");
}

function renderTable(rows){

  const tbody=document.getElementById("tableBody");
  tbody.innerHTML="";

  rows.forEach((row,index)=>{

    const tr=document.createElement("tr");

    tr.innerHTML=`
      <td>${index+1}</td>
      <td>${row.solId}</td>
      <td>${row.branchName||"-"}</td>
      <td>${row.allotted}</td>
      <td>${row.conducted}</td>
      <td>${row.pending}</td>
      <td>
        <a href="./sol-details.html?sol=${encodeURIComponent(row.solId)}">
          View Details
        </a>
      </td>
    `;

    tbody.appendChild(tr);
  });
}

function filterTable(){

  const filter=document.getElementById("search")
    .value.toLowerCase();

  const rows=document.querySelectorAll("#tableBody tr");

  rows.forEach(row=>{
    const text=row.textContent.toLowerCase();
    row.style.display=text.includes(filter)?"":"none";
  });
}

async function loadDashboard(){

  try{

    setStatus("Loading master data and camp reports...");

    const masterResponse=await api("getMasterData");

    const reportResponse=await api("adminGetReports");

    buildDashboard(masterResponse,reportResponse);

  }catch(error){

    console.error(error);

    setStatus(
      "FAILED: "+error.message+
      " | Please check Apps Script deployment and API response.",
      true
    );
  }
}

loadDashboard();

</script>

</body>
</html>
